<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>五連戰線｜遠端真人 Alpha</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/alpha_board.css">
  <style>
    :root{--bg:#10131a;--panel:#1a202b;--line:#343d4d;--text:#edf2f7;--muted:#aab4c3;--red:#ff6b6b;--blue:#4dabf7;--warn:#ffd43b;--green:#69db7c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20293a,#0d1016 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit}.app{max-width:1420px;margin:auto;padding:14px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top h1{font-size:22px;margin:0 10px 0 0}.pill{border:1px solid var(--line);background:#151b25;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}
    .panel,.section{background:rgba(26,32,43,.95);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 30px #0004}.lobby{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.lobby input{width:150px;background:#0f141d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;text-transform:uppercase}.btn{border:1px solid #465269;background:#273247;color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer}.btn:hover:not(:disabled){filter:brightness(1.15)}.btn:disabled{opacity:.42;cursor:not-allowed}.btn.active{outline:2px solid var(--warn)}.btn.danger{background:#6b2730}.btn.art{background:#604d12}
    .connection{font-weight:700}.ok{color:var(--green)}.bad{color:var(--red)}.wait{color:var(--warn)}.layout{display:grid;grid-template-columns:minmax(420px,1fr) minmax(280px,390px);gap:12px}.gameCol{min-width:0}
    .hand{display:flex;gap:7px;flex-wrap:wrap}.card{min-width:66px;min-height:66px;background:#222c3b;color:var(--text);border:1px solid #4b5870;border-radius:10px;cursor:pointer;padding:6px}.card.sel{outline:3px solid var(--warn)}.ico{display:block;font-size:23px}.name{font-size:12px;font-weight:700}.meta,.note{font-size:12px;color:var(--muted)}.rankRow{display:flex;gap:6px;margin-top:7px}.side{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 90px);overflow:auto}.section h3{margin:0 0 8px;font-size:15px}.turn{font-size:18px;font-weight:900}.status{padding:8px;border-radius:9px;background:#111722;border:1px solid var(--line);white-space:pre-line}.log{height:330px;overflow:auto;display:flex;flex-direction:column-reverse;gap:5px;font-size:12px}.log div{padding:6px;border-bottom:1px solid #30394a}.log .r{color:#ff9b9b}.log .b{color:#91caff}.log .kill,.log .winner{color:var(--warn);font-weight:800}.hidden{display:none!important}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{max-height:none}.board{width:min(96vw,700px)}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>五連戰線｜遠端真人 Alpha</h1>
    <span class="pill">Server Authoritative</span><span class="pill">9×9</span><span class="pill">兩人房</span>
    <a class="pill" href="/local">本機原型</a>
  </div>
  <div class="panel lobby">
    <span id="socketStatus" class="connection wait">連線中…</span>
    <button id="createBtn" class="btn" disabled>建立房間</button>
    <input id="roomInput" maxlength="6" placeholder="輸入 6 位房號">
    <button id="joinBtn" class="btn" disabled>加入房間</button>
    <strong id="roomIdentity"></strong>
  </div>
  <div class="layout">
    <div class="gameCol">
      <div class="panel boardWrap"><div id="board" class="board"></div></div>
      <div class="panel" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong id="handTitle">等待加入房間</strong><span id="deckInfo" class="meta"></span></div>
        <div id="hand" class="hand" style="margin-top:8px"></div>
        <div id="rankRow" class="rankRow"></div>
      </div>
    </div>
    <div class="side">
      <div class="section">
        <h3>房間與回合</h3>
        <div id="connectionDetail" class="status">尚未建立或加入房間。</div>
        <div id="turnText" class="turn" style="margin-top:8px"></div>
        <div id="turnStatus" class="status" style="margin-top:8px"></div>
        <div id="artilleryOverview" class="status" style="margin-top:8px">公開炮擊資源｜P1：2｜P2：2</div>
        <button id="artilleryBtn" class="btn art" disabled style="margin-top:8px">炮擊</button>
        <div class="note" style="margin-top:6px">炮擊只能在自己的部署前使用；使用後仍須部署。所有合法性與結算均由伺服器決定。</div>
      </div>
      <div class="section"><h3>公開／私人資訊</h3><div id="privacyInfo" class="status">自己的手牌會顯示在左側；只會看到對方手牌數量。</div></div>
      <div class="section"><h3>戰鬥紀錄</h3><div id="log" class="log"></div></div>
      <div class="section hidden" id="matchSummarySection"><h3>終局摘要</h3><div id="matchSummary" class="status"></div></div>
    </div>
  </div>
</div>
<script src="/alpha_client.js"></script>
</body>
</html>
