<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>五連戰線｜遠端真人 Alpha</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/alpha_board.css?v=12">
  <link rel="stylesheet" href="/game_shell.css?v=12">
  <link rel="stylesheet" href="/local_layout.css?v=12">
  <style>
    /* 只保留連線專屬的樣式；版面一律沿用與單機相同的 game_shell + local_layout。 */
    .lobby { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    .lobby input {
      width: 132px; background: #0f141d; color: var(--text);
      border: 1px solid var(--grid); border-radius: 8px; padding: 7px 9px; text-transform: uppercase;
    }
    .connection { font-weight: 700; white-space: nowrap; }
    .ok { color: var(--good) } .bad { color: var(--danger) } .wait { color: var(--warn) }
    .btn.art { background: #604d12 }
    #roomIdentity { white-space: nowrap; font-size: 13px }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>五連戰線｜連線對戰</h1>
    <a class="btn modeLink" href="/local">🎮 單機測試</a>
    <span id="socketStatus" class="connection wait">連線中…</span>
    <span class="lobby">
      <button id="createBtn" class="btn" disabled>建立房間</button>
      <input id="roomInput" maxlength="6" placeholder="房號">
      <button id="joinBtn" class="btn" disabled>加入房間</button>
      <button id="copyRoomBtn" class="btn hidden" type="button">複製房號</button>
    </span>
    <strong id="roomIdentity"></strong>
    <button id="backToEntryBtn" class="btn" type="button">← 模式選擇</button>
    <span class="pill">9×9</span>
    <span class="pill">25 張循環牌組</span>
    <span class="pill counterHint" title="盾克劍、劍克槍、槍克盾">
      相剋　<b>🛡盾</b> → <b>⚔劍</b> → <b>🔱槍</b> → <b>🛡盾</b>
    </span>
    <button id="helpBtn" class="btn helpBtn" type="button">？ 規則</button>
  </div>

  <div class="layout">
    <div class="gameCol">
      <div class="boardWrap">
        <div id="board" class="board"></div>
        <svg id="forecastLayer" class="forecastLayer" aria-hidden="true"></svg>
      </div>
      <div class="handPanel">
        <div class="handHeader">
          <strong id="handTitle">等待加入房間</strong>
          <span class="meta" id="deckInfo"></span>
          <span class="handHint">滑鼠移到手牌（或點選）可看兵種大卡</span>
        </div>
        <div id="hand" class="hand"></div>
        <div id="rankRow" class="rankRow"></div>
        <div id="cardDetail" class="cardDetail idle"></div>
      </div>
    </div>

    <div class="side">
      <div class="section turnSection">
        <h3>目前回合</h3>
        <div id="turnText" class="turn"></div>
        <div id="phaseBadge" class="phaseBadge"></div>
        <div id="turnStatus" class="status actionStatus"></div>
        <div id="artilleryOverview" class="status artilleryStatus">炮擊資源｜P1：2｜P2：2</div>
        <button id="artilleryBtn" class="btn artBtn ready" disabled>炮擊</button>
        <div class="note">炮擊是部署前的額外戰術行動，每回合最多 1 次；炮擊後仍必須正常部署。3×3 範圍敵我皆傷：中心 30、外圈 12。</div>
      </div>

      <div class="section previewSection">
        <h3>房間狀態</h3>
        <div id="connectionDetail" class="combatPreview">尚未建立或加入房間。</div>
        <div id="privacyInfo" class="combatPreview" style="display:none"></div>
        <div id="matchSummary" class="combatPreview" style="display:none"></div>
      </div>

      <div class="section logSection">
        <h3>戰報</h3>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="entryOverlay" class="overlay">
  <div class="overlayBox">
    <h2>五連戰線　Alpha</h2>
    <p class="overlaySub">9×9 棋盤。放下的棋子會互相戰鬥，<b>戰鬥結束後仍然存活的五連</b>才算獲勝。</p>
    <div class="entryChoices">
      <button id="entryOnlineBtn" class="btn entryBtn" type="button">
        <span class="entryTitle">連線對戰</span>
        <span class="entryDesc">建立或加入房間，跟朋友遠端對戰。<br>使用目前的正式規則。</span>
      </button>
      <a id="entryLocalBtn" class="btn entryBtn" href="/local">
        <span class="entryTitle">單機測試</span>
        <span class="entryDesc">在本機對電腦或本機雙人試玩。<br>與連線對戰使用<b>同一套規則引擎</b>。</span>
      </a>
    </div>
    <button id="entryHelpBtn" class="btn" type="button" style="margin-top:14px">？ 先看規則</button>
  </div>
</div>

<div id="rulesOverlay" class="overlay hidden">
  <div class="overlayBox rulesBox">
    <div class="rulesHead">
      <h2>規則與兵種說明</h2>
      <button id="rulesCloseBtn" class="btn" type="button">關閉</button>
    </div>
    <div id="rulesBody" class="rulesBody"></div>
  </div>
</div>

<script src="/game_engine.js"></script>
<script src="/alpha_ui.js"></script>
<script src="/alpha_client.js"></script>
</body>
</html>
