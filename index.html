<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>五連戰線｜單機對局</title>
<link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="/alpha_board.css?v=18">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/game_shell.css?v=16">
<link rel="stylesheet" href="/local_layout.css?v=18">

  <link rel="stylesheet" href="/battlefield.css?v=1">
</head>
<body class="battleDesign">
<div id="battlefield" class="battlefield"></div>

<div id="rulesOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="規則與兵種說明">
  <div class="overlayBox rulesBox">
    <div class="rulesHead">
      <h2>規則與兵種說明</h2>
      <button id="rulesCloseBtn" class="btn" type="button">關閉</button>
    </div>
    <div id="rulesBody" class="rulesBody"></div>
  </div>
</div>

<div id="resultOverlay" class="overlay resultOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="overlayBox resultBox">
    <div class="resultEyebrow">對局結束</div>
    <h2 id="resultTitle"></h2>
    <p id="resultReason" class="resultReason"></p>
    <div class="resultActions">
      <button id="resultRematchBtn" class="btn resultPrimary" type="button">再來一局</button>
      <button id="resultLeaveBtn" class="btn" type="button">查看棋盤</button>
      <button id="resultReportBtn" class="btn" type="button" aria-expanded="false">看戰報</button>
    </div>
    <div id="resultReport" class="resultReport hidden" aria-live="polite"></div>
  </div>
</div>

<script src="/game_engine.js?v=20260908"></script>
<script src="/alpha_ui.js?v=20260908"></script>
<script src="/battlefield.js?v=1"></script>
<script src="/local_client.js?v=20260908"></script>
</body>
</html>
