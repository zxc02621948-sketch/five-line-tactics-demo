<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>五連戰線 - 最小原型</title>
<link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="/alpha_board.css">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#0e1117; --panel:#171c24; --panel2:#222a38; --text:#eef2f7; --muted:#9aa4b2;
    --p1:#ff6b6b; --p2:#4dabf7; --grid:#3b4352; --cell:#121720; --danger:#ff3b30;
    --good:#51cf66; --warn:#ffd43b; --topbar:64px;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
  body{overscroll-behavior:none}
  button{font:inherit}
  .app{
    width:100vw;height:100vh;max-width:none;margin:0;padding:12px 14px;
    display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;overflow:hidden;
  }
  .top{
    display:flex;gap:8px;flex-wrap:nowrap;align-items:center;min-height:52px;
    overflow-x:auto;overflow-y:hidden;padding-bottom:2px;scrollbar-width:thin;
  }
  h1{font-size:clamp(18px,1.5vw,26px);margin:0 10px 0 0;white-space:nowrap}
  .pill{padding:7px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:12px;white-space:nowrap}
  .btn{border:1px solid #465064;background:#252c39;color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#30394a}
  .btn.active{outline:2px solid var(--warn)}
  .btn.danger{border-color:#8c2e2e}
  .layout{
    min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,24vw);
    gap:12px;overflow:hidden;
  }
  .gameCol{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .boardWrap,.side,.handPanel{
    background:var(--panel);border:1px solid #2b3240;border-radius:14px;
  }
  .boardWrap{
    min-height:0;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .board{
    display:grid;grid-template-columns:repeat(9,1fr);
    width:min(100%,calc(100vh - 230px));height:auto;aspect-ratio:1/1;
    max-width:100%;max-height:100%;margin:auto;border:1px solid var(--grid);background:#0f1218;
  }
  .cell{
    position:relative;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
    display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0;
  }
  .cell:nth-child(9n){border-right:none}
  .cell:hover{background:#1d2430}
  .cell.artillery-target{background:rgba(255,212,59,.14)}
  .unit{
    width:76%;height:76%;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:clamp(13px,2.0vmin,28px);font-weight:800;position:relative;border:2px solid transparent;
    box-shadow:0 2px 9px rgba(0,0,0,.35)
  }
  .p1{background:color-mix(in srgb,var(--p1) 75%,#1a1a1a);border-color:#ff8787}
  .p2{background:color-mix(in srgb,var(--p2) 75%,#1a1a1a);border-color:#74c0fc}
  .engaged{box-shadow:0 0 0 2px var(--danger),0 0 12px rgba(255,59,48,.75)}
  .unit small{
    position:absolute;bottom:-14px;font-size:clamp(7px,0.7vw,10px);color:#fff;background:#0c0f14;
    border-radius:5px;padding:1px 3px;white-space:nowrap
  }
  .stars{position:absolute;top:-15px;font-size:clamp(8px,0.85vw,12px);color:var(--warn);white-space:nowrap;text-shadow:0 1px 2px #000}
  .hpbar{position:absolute;left:5%;right:5%;bottom:5%;height:4px;background:#3a1d1d;border-radius:9px;overflow:hidden}
  .hpbar i{display:block;height:100%;background:#69db7c}
  .side{
    min-height:0;display:flex;flex-direction:column;gap:9px;padding:10px;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;
  }
  .section{background:#151922;border:1px solid #2a3140;border-radius:11px;padding:10px;flex:0 0 auto}
  .section h3{font-size:14px;margin:0 0 8px;color:#cbd5e1}
  .turn{font-size:18px;font-weight:800}
  .turn.p1t{color:var(--p1)} .turn.p2t{color:var(--p2)}
  .handPanel{padding:9px 10px;overflow:hidden}
  .hand{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .card{
    flex:0 0 62px;min-height:76px;border-radius:10px;border:2px solid #455065;background:#202632;
    color:#fff;padding:5px 4px;cursor:pointer;text-align:center
  }
  .card.sel{outline:3px solid var(--warn)}
  .card .ico{font-size:23px;display:block}
  .card .name{font-size:12px;font-weight:700}
  .card .stat{font-size:10px;color:#b7c0cc;margin-top:3px}
  .rankRow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .rankRow button:disabled{opacity:.35;cursor:not-allowed}
  .meta{font-size:12px;color:var(--muted);line-height:1.45}
  .combatPreview{font-size:12px;line-height:1.5;white-space:pre-wrap}
  .log{height:150px;overflow:auto;font-size:12px;line-height:1.45;background:#0f131a;border-radius:8px;padding:8px}
  .log .r{color:#ff8787}.log .b{color:#74c0fc}.log .sys{color:#adb5bd}.log .kill{color:#ffd43b}
  .status{padding:8px;border-radius:9px;background:#202632;font-size:13px}
  .winner{background:#2b4b2f;border:1px solid #4c8f58;color:#baf7c2}
  .help{font-size:12px;color:#aab4c1;line-height:1.55}
  .artBtn{width:100%;margin-top:7px}
  .artBtn.ready{border-color:#d6a500;color:#ffe066}
  .note{font-size:11px;color:#8993a0;margin-top:5px}

  @media(max-height:760px){
    .app{padding:8px 10px;gap:7px}
    .top{min-height:44px}
    .board{width:min(100%,calc(100vh - 190px))}
    .side{gap:7px;padding:8px}
    .section{padding:8px}
    .help,.combatPreview,.meta,.log{font-size:11px}
    .log{height:110px}
    .card{min-height:68px}
  }

  @media(max-width:900px){
    html,body{overflow:auto}
    .app{height:auto;min-height:100vh;overflow:visible}
    .top{flex-wrap:wrap}
    .layout{grid-template-columns:1fr;overflow:visible}
    .gameCol{display:block}
    .boardWrap{height:min(92vw,72vh)}
    .board{width:min(100%,92vw);max-height:none}
    .handPanel{margin-top:10px}
    .side{max-height:none;overflow:visible;margin-top:10px}
  }

  @media(max-width:560px){
    .app{padding:7px}
    h1{width:100%;font-size:18px}
    .pill{display:none}
    .boardWrap{padding:5px;height:calc(100vw - 14px)}
    .unit{width:72%;height:72%;font-size:18px}
    .side{padding:7px}
    .card{flex-basis:58px}
  }
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <h1>五連戰線｜單機測試</h1>
    <a class="btn" href="/">← 主畫面</a>
    <button class="btn" id="pveBtn">對電腦</button>
    <button class="btn" id="pvpBtn">本機雙人</button>
    <button class="btn danger" id="resetBtn">重開</button>
    <button class="btn" id="fullscreenBtn">全螢幕</button>
    <span class="pill">9×9</span>
    <span class="pill">25 張循環牌組</span>
    <span class="pill counterHint" title="盾克劍、劍克槍、槍克盾">
      相剋　<b>🛡盾</b> → <b>⚔劍</b> → <b>🔱槍</b> → <b>🛡盾</b>
    </span>
    <button id="helpBtn" class="btn helpBtn" type="button">？ 規則</button>
  </div>

  <div class="layout">
    <div class="gameCol">
      <div class="boardWrap">
        <div id="board" class="board"></div>
      </div>
      <div class="handPanel" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
          <strong id="handTitle">手牌</strong>
          <span class="meta" id="deckInfo"></span>
        </div>
        <div id="hand" class="hand" style="margin-top:8px"></div>
        <div id="rankRow" class="rankRow"></div>
        <div id="cardDetail" class="cardDetail">滑鼠移到手牌上（或點選手牌）可看該兵種的詳細能力。</div>
      </div>
    </div>

    <div class="side">
      <div class="section">
        <h3>目前回合</h3>
        <div id="turnText" class="turn"></div>
        <div id="status" class="status" style="margin-top:8px"></div>
        <div id="artilleryOverview" class="status" style="margin-top:8px"></div>
        <button id="artilleryBtn" class="btn artBtn ready">炮擊（本場剩 2 發）</button>
        <div class="note">炮擊是部署前的額外戰術行動，每回合最多 1 次；炮擊後仍必須正常部署。3×3 範圍敵我皆傷：中心 30、外圈 12。</div>
        <div id="testSummary" class="combatPreview" style="display:none;margin-top:8px"></div>
      </div>

      <div class="section">
        <h3>戰況說明</h3>
        <div id="preview" class="combatPreview">點手牌可看兵種詳情；規則按鈕可看完整說明。</div>
      </div>

      <div class="section">
        <h3>戰報</h3>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="rulesOverlay" class="overlay hidden">
  <div class="overlayBox rulesBox">
    <div class="rulesHead">
      <h2>規則與兵種說明</h2>
      <button id="rulesCloseBtn" class="btn" type="button">關閉</button>
    </div>
    <div id="rulesBody" class="rulesBody"></div>
  </div>
</div>

<script src="/game_engine.js"></script>
<script src="/alpha_ui.js"></script>
<script src="/local_client.js"></script>
</body>
</html>
